name: Deploy CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-and-test:
    name: Build and tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar e executar testes
        run: ./gradlew clean test --no-daemon

  deploy:
    name: Deploy
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Empacotar aplicação
        run: ./gradlew bootJar --no-daemon

      - name: Deploy para produção
        run: echo "Deploy executado após build e testes em master com sucesso."
