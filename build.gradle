package br.senai.aula.web.domain.cards;

public record Card(
        Long id,
        String name,
        String description,
        int attack,
        int defense,
        int cost,
        CardType type
) {

    public static Card newCard(
            String name,
            String description,
            int attack,
            int defense,
            int cost,
            CardType type) {

        return new Card(
                null,
                name,
                description,
                attack,
                defense,
                cost,
                type
        );
    }
}